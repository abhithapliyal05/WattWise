name: ci
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DWATTWISE_TESTS=ON
      - name: Build
        run: cmake --build build -j
      - name: Test (unit + differential + invalid programs)
        run: ctest --test-dir build --output-on-failure
